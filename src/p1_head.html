<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Neural Resonance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed canvas (the specimen) with thin instrument panels floating over it,
   the way labels sit on an anatomical plate. Single committed dark look: a lit brain in a dark room. */
:root{
  --bg:#05070d; --bg-2:#0b111c; --fg:#dfe6f3; --fg-dim:#8a96ab; --fg-faint:#5b6678;
  --line:rgba(150,190,255,.16); --line-strong:rgba(150,190,255,.34);
  --panel:rgba(7,11,20,.74); --accent:#9dbcff; --bone:#9cc0ff;
  --da:#ff5fb4; --ne:#ffb347; --ht:#5fe0a8; --glu:#7fd3ff;
  --font-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:12.5px/1.45 var(--font-mono);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--bg)}
#stage.dragging{cursor:grabbing}

.ui{position:fixed;inset:0;pointer-events:none;display:grid;gap:12px;
  grid-template-columns:minmax(0,1fr) minmax(0,auto);grid-template-rows:auto minmax(0,1fr) auto;
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui>*{pointer-events:auto;min-width:0}

.brand{grid-column:1;grid-row:1;align-self:start;max-width:34rem}
.brand h1{margin:0;font:italic 500 clamp(26px,4vw,38px)/1 var(--font-display);letter-spacing:.01em;color:#eef3ff;text-wrap:balance;text-shadow:0 0 24px rgba(120,170,255,.25)}
.brand .status{margin:6px 0 0;color:var(--fg-dim);font-size:11.5px;letter-spacing:.04em}
.brand .status b{color:var(--fg);font-weight:500}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.readout{grid-column:2;grid-row:1/4;align-self:start;width:min(280px,calc(100vw - 32px));max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.readout-head{all:unset;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:pointer;font:500 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim);border-bottom:1px solid var(--line)}
.readout-head:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
.readout-head .chev{width:7px;height:7px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg);transition:transform .2s}
.readout.collapsed .readout-head{border-bottom-color:transparent}
.readout.collapsed .readout-head .chev{transform:rotate(-135deg)}
.readout.collapsed .readout-body{display:none}
.readout-body{overflow:auto;padding:10px 12px 12px;scrollbar-width:thin}
.readout h2{margin:14px 0 6px;font:500 10px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:5px;font-variant-numeric:tabular-nums}
.facts>div{display:contents}
.facts dt{color:var(--fg-dim)}
.facts dd{margin:0;color:var(--fg);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts dd .flag{color:var(--ne);margin-left:6px;font-size:10px;letter-spacing:.08em}
.bar{display:inline-block;vertical-align:middle;width:100%;height:5px;background:rgba(150,190,255,.1);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .08s linear}
.meters{display:grid;gap:7px}
.meter{display:grid;grid-template-columns:7.2em 1fr;align-items:center;column-gap:10px;row-gap:2px}
.meter span:first-child{color:var(--fg-dim)}
.meter em{grid-column:2;font-style:normal;font-size:10px;color:var(--fg-faint);letter-spacing:.04em;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .bar.da i{background:var(--da)} .meter .bar.ne i{background:var(--ne)} .meter .bar.ht i{background:var(--ht)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.legend button{all:unset;display:grid;grid-template-columns:10px 1fr;align-items:center;gap:9px;width:100%;padding:3px 4px;border-radius:3px;cursor:pointer;color:var(--fg-dim);font:inherit;font-size:11.5px}
.legend button:hover,.legend button:focus-visible{background:rgba(150,190,255,.08);color:var(--fg);outline:none}
.legend .sw{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
.legend .lim{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);margin-left:5px}

.dock{grid-column:1;grid-row:3;align-self:end;display:flex;flex-direction:column;gap:8px;max-width:40rem}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{all:unset;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:3px;background:var(--panel);color:var(--fg);font:500 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.btn.on{border-color:var(--accent);color:#fff;box-shadow:inset 0 0 0 1px rgba(157,188,255,.35),0 0 16px rgba(157,188,255,.18)}
.btn.quiet{border-color:var(--line);color:var(--fg-dim)}
.btn.icon{padding:7px 10px;min-width:32px;justify-content:center;font-size:13px}
.btn[hidden]{display:none}
.transport{display:flex;align-items:center;gap:8px;padding:6px 8px;max-width:100%}
.transport input[type=range]{flex:1;min-width:80px;accent-color:var(--accent);height:14px;margin:0}
.transport .t{font-variant-numeric:tabular-nums;color:var(--fg-dim);font-size:11px;white-space:nowrap}
.transport .name{max-width:12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-dim);font-size:11px}
.hint{color:var(--fg-faint);font-size:10.5px;letter-spacing:.03em;max-width:26rem}

.tip{position:fixed;left:0;top:0;pointer-events:none;max-width:260px;padding:8px 11px 9px;background:rgba(7,11,20,.86);border:1px solid var(--line-strong);border-radius:3px;transform:translate(14px,14px);z-index:5}
.tip h3{margin:0;font:italic 500 17px/1.15 var(--font-display);color:#f0f4ff}
.tip p{margin:4px 0 0;color:var(--fg-dim);font-size:11px;line-height:1.4}
.tip .rc{margin-top:5px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.tip .rc i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:0}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(90vw,34rem);padding:9px 14px;background:rgba(7,11,20,.9);border:1px solid var(--line-strong);border-radius:3px;color:var(--fg);font-size:12px;z-index:6;text-align:center}

@media (max-width:760px){
  .ui{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;gap:8px}
  .brand{grid-column:1;grid-row:1}
  .readout{grid-column:1;grid-row:3;width:100%;max-height:46vh}
  .dock{grid-column:1;grid-row:4;max-width:none}
  .hint{display:none}
  .brand h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){ .bar i{transition:none} }
</style>
</head>
<body>
